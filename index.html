<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 JS - Precious Ndegwa</title>
<style>
body{font-family:monospace;padding:16px;background:#fff;color:#222}
h1{font-size:18px}
#output{background:#111;color:#0f0;padding:12px;white-space:pre-wrap;word-break:break-word;border-radius:8px;min-height:200px}
</style>
</head>
<body>
<h1>Week 4 JS - Precious Ndegwa - Output:</h1>
<div id="output">Loading...</div>

<script>
const outputDiv = document.getElementById('output');
outputDiv.textContent = '';
const originalLog = console.log;
console.log = function(...args){
  originalLog.apply(console, args);
  const text = args.map(a => {
    if (typeof a === 'object') return JSON.stringify(a, null, 2);
    return String(a);
  }).join(' ');
  outputDiv.textContent += text + '\n';
};
</script>
<script src="main.js"></script>
</body>
</html>
